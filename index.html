<script>
const stream = "https://stream.zeno.fm/7mk2bzwy5x8uv.aac";
const idzeno = "7mk2bzwy5x8uv";

// Reproductor
const audio = new Audio(stream);
window.onload = () => audio.play();

const PLAYPAUSE = () => {
    if (audio.paused) {
        audio.load();
        audio.play();
    } else {
        audio.pause();
    }
};

audio.onplay = () => $(".loading, .eq, .play").addClass("on");
audio.onpause = () => $(".loading, .eq, .play").removeClass("on");
audio.onerror = () => alert("Error Radio Aventura estamos resolviendo.");
$("#volume").on("input", function () {
    audio.volume = this.value / 100;
});

// Metadata y Cover
let songNow = "";
function fetchMetadata() {
    $.getJSON(
        `https://zenoplay.zenomedia.com/api/zenofm/nowplaying/${idzeno}?ra=${Math.random()}`,
        (data) => {
            const currentSong = data.title || "Error de Api - revise los datos";
            if (currentSong === songNow) return;
            songNow = currentSong;

            // Separar artista y canción
            const [artist, song] = currentSong.split(" - ");
            $(".artist").text(artist || "Artista desconocido");
            $(".song").text(song || "Canción desconocida");
            document.title = currentSong;

            // Obtener portada desde iTunes
            $.getJSON(
                `https://itunes.apple.com/search?term=${artist.replace(
                    /\W+/g,
                    "+"
                )}&media=music&limit=1`,
                (coverData) => {
                    const image =
                        coverData.results[0]?.artworkUrl100.replace(
                            "100x100bb",
                            "600x600bb"
                        ) || "img/default.jpg";

                    $(".images").html(
                        `<img src="${image}" class="lazyload" alt="${currentSong}" />`
                    );

                    $(".bg").html(
                        `<img src="${image}" class="lazyload" alt="" />`
                    );
                }
            );
        }
    );
}

fetchMetadata();
setInterval(fetchMetadata, 5000);
</script>
